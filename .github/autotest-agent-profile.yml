apiVersion: v1beta1
kind: RepositoryAgentProfile
routes:
  - id: source-fix
    default: true
    match:
      issueLabel: agent:source-fix
      defaultMode: bug-fix
      allowedModes:
        - bug-fix
    policy:
      instructionPaths:
        - CONTRIBUTING.md
      maxRepairAttempts: 2
    capability:
      name: vscode-gradle-source-fix
      settings:
        writeGlobs:
          - gradle-language-server/**
        planGlobs:
          - gradle-language-server/src/test/**/*.java
        unitTestProof:
          skill: unit-test-proof
          workflow:
            name: AutoTest Unit Test Proof
            path: .github/workflows/autotest-unit-test-proof.yml
          selectorFlag: --tests
          inputs:
            selector: test_selector
            candidateSha: candidate_sha
            phase: phase
            executionId: execution_id
          resultArtifactTemplate: autotest-unit-test-proof-{execution_id}
          resultFile: result.json
        workflow:
          name: Build & Publish
          path: .github/workflows/main.yml
          plansInput: scope
          requiredPlatforms:
            - linux
            - windows
          artifactNameTemplate: source-fix-{platform}-{plan}
        requiredPullRequestWorkflows:
          - .github/workflows/main.yml
  - id: triage
    match:
      issueLabel: agent:triage
      defaultMode: triage
      allowedModes:
        - triage
    capability:
      name: repository-issue-triage
      settings: {}